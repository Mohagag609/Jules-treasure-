version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: construction_db
    environment:
      POSTGRES_DB: construction_projects
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./lib/db/postgres-schema-updated.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d construction_projects"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: construction_app
    environment:
      DATABASE_URL: postgresql://admin:admin123@postgres:5432/construction_projects
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: your-secret-key-here
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./public:/app/public
      - ./.env:/app/.env

volumes:
  postgres_data: