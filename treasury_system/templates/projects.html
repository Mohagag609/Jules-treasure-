<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة المشاريع المتكامل</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .main-container {
            padding: 20px;
        }
        
        .project-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        
        .project-card:hover {
            transform: translateY(-5px);
        }
        
        .phase-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            border-left: 4px solid #667eea;
        }
        
        .partner-badge {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            margin: 5px;
        }
        
        .quick-entry {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 1000;
        }
        
        .quick-entry-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            font-size: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.3s;
        }
        
        .quick-entry-btn:hover {
            transform: scale(1.1);
        }
        
        .stats-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .stats-card h3 {
            color: #667eea;
            font-size: 32px;
            margin: 10px 0;
        }
        
        .progress-custom {
            height: 30px;
            border-radius: 15px;
            background: #e9ecef;
        }
        
        .progress-bar-custom {
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Header -->
        <div class="text-center mb-4">
            <h1 class="text-white">
                <i class="fas fa-project-diagram"></i>
                نظام إدارة المشاريع المتكامل
            </h1>
        </div>
        
        <!-- Stats Row -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="stats-card">
                    <i class="fas fa-folder-open fa-2x text-primary"></i>
                    <h3 id="totalProjects">0</h3>
                    <p>إجمالي المشاريع</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card">
                    <i class="fas fa-users fa-2x text-success"></i>
                    <h3 id="totalPartners">0</h3>
                    <p>إجمالي الشركاء</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card">
                    <i class="fas fa-money-bill-wave fa-2x text-warning"></i>
                    <h3 id="totalInvested">0</h3>
                    <p>إجمالي الاستثمار</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card">
                    <i class="fas fa-chart-line fa-2x text-danger"></i>
                    <h3 id="totalProfit">0</h3>
                    <p>إجمالي الأرباح</p>
                </div>
            </div>
        </div>
        
        <!-- Projects List -->
        <div id="projectsList"></div>
        
        <!-- Add Project Button -->
        <div class="text-center mt-4">
            <button class="btn btn-lg btn-light" onclick="showAddProjectModal()">
                <i class="fas fa-plus"></i> إضافة مشروع جديد
            </button>
        </div>
    </div>
    
    <!-- Quick Entry Button -->
    <div class="quick-entry">
        <button class="quick-entry-btn" onclick="showQuickEntryModal()" title="إدخال سريع">
            <i class="fas fa-bolt"></i>
        </button>
    </div>
    
    <!-- Add Project Modal -->
    <div class="modal fade" id="addProjectModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">إضافة مشروع جديد</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="projectForm">
                        <div class="mb-3">
                            <label class="form-label">اسم المشروع</label>
                            <input type="text" class="form-control" id="projectName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">الوصف</label>
                            <textarea class="form-control" id="projectDescription" rows="3"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">الميزانية الكلية</label>
                                    <input type="number" class="form-control" id="projectBudget" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">تاريخ البداية</label>
                                    <input type="date" class="form-control" id="projectStartDate">
                                </div>
                            </div>
                        </div>
                        
                        <h5 class="mt-3">الشركاء</h5>
                        <div id="partnersSection"></div>
                        <button type="button" class="btn btn-sm btn-secondary" onclick="addPartnerRow()">
                            <i class="fas fa-plus"></i> إضافة شريك
                        </button>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                    <button type="button" class="btn btn-primary" onclick="saveProject()">حفظ المشروع</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Quick Entry Modal -->
    <div class="modal fade" id="quickEntryModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">إدخال سريع للسندات</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="quickVoucherForm">
                        <div class="mb-3">
                            <label class="form-label">نوع السند</label>
                            <select class="form-select" id="quickVoucherType" onchange="updateQuickForm()">
                                <option value="payment">صرف (دفعة لمورد)</option>
                                <option value="receipt">قبض (إيراد)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">المشروع</label>
                            <select class="form-select" id="quickProject" onchange="loadProjectPhases()">
                                <option value="">اختر المشروع</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">المرحلة</label>
                            <select class="form-select" id="quickPhase" onchange="loadPhaseSuppliers()">
                                <option value="">اختر المرحلة</option>
                            </select>
                        </div>
                        <div class="mb-3" id="supplierSection">
                            <label class="form-label">المورد</label>
                            <select class="form-select" id="quickSupplier">
                                <option value="">اختر المورد</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">المبلغ</label>
                            <input type="number" class="form-control" id="quickAmount" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">الوصف</label>
                            <input type="text" class="form-control" id="quickDescription">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                    <button type="button" class="btn btn-danger" onclick="saveQuickVoucher()">
                        <i class="fas fa-save"></i> حفظ السند
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let projectsData = [];
        let partnersData = [];
        let suppliersData = [];
        
        // Load initial data
        document.addEventListener('DOMContentLoaded', function() {
            loadProjects();
            loadPartners();
            loadSuppliers();
        });
        
        async function loadProjects() {
            try {
                const response = await fetch('/api/projects');
                projectsData = await response.json();
                renderProjects();
                updateStats();
            } catch (error) {
                console.error('Error loading projects:', error);
            }
        }
        
        async function loadPartners() {
            try {
                const response = await fetch('/api/partners');
                partnersData = await response.json();
            } catch (error) {
                console.error('Error loading partners:', error);
            }
        }
        
        async function loadSuppliers() {
            try {
                const response = await fetch('/api/suppliers');
                suppliersData = await response.json();
            } catch (error) {
                console.error('Error loading suppliers:', error);
            }
        }
        
        function renderProjects() {
            const container = document.getElementById('projectsList');
            
            if (projectsData.length === 0) {
                container.innerHTML = `
                    <div class="alert alert-info text-center">
                        <i class="fas fa-info-circle"></i> لا توجد مشاريع حالياً
                    </div>
                `;
                return;
            }
            
            container.innerHTML = projectsData.map(project => `
                <div class="project-card">
                    <div class="row">
                        <div class="col-md-8">
                            <h3>${project.name}</h3>
                            <p class="text-muted">${project.description || 'بدون وصف'}</p>
                            <div class="mb-3">
                                <span class="badge bg-primary">
                                    <i class="fas fa-users"></i> ${project.partners_count} شريك
                                </span>
                                <span class="badge bg-success ms-2">
                                    <i class="fas fa-tasks"></i> ${project.phases_count} مرحلة
                                </span>
                                <span class="badge bg-${project.status === 'active' ? 'success' : 'warning'} ms-2">
                                    ${project.status === 'active' ? 'نشط' : 'قيد التخطيط'}
                                </span>
                            </div>
                        </div>
                        <div class="col-md-4 text-end">
                            <h4 class="${project.profit >= 0 ? 'text-success' : 'text-danger'}">
                                ${formatMoney(project.profit)}
                            </h4>
                            <p class="text-muted">الربح/الخسارة</p>
                            <button class="btn btn-primary btn-sm" onclick="viewProject(${project.id})">
                                <i class="fas fa-eye"></i> عرض التفاصيل
                            </button>
                        </div>
                    </div>
                    
                    <div class="progress progress-custom mt-3">
                        <div class="progress-bar progress-bar-custom" style="width: ${(project.total_spent / project.total_budget * 100) || 0}%">
                            ${Math.round((project.total_spent / project.total_budget * 100) || 0)}%
                        </div>
                    </div>
                    <small class="text-muted">
                        المصروف: ${formatMoney(project.total_spent)} من ${formatMoney(project.total_budget)}
                    </small>
                </div>
            `).join('');
        }
        
        function updateStats() {
            document.getElementById('totalProjects').textContent = projectsData.length;
            
            const totalInvested = projectsData.reduce((sum, p) => sum + p.total_invested, 0);
            const totalProfit = projectsData.reduce((sum, p) => sum + p.profit, 0);
            
            document.getElementById('totalPartners').textContent = partnersData.length;
            document.getElementById('totalInvested').textContent = formatMoney(totalInvested);
            document.getElementById('totalProfit').textContent = formatMoney(totalProfit);
        }
        
        function showAddProjectModal() {
            document.getElementById('projectForm').reset();
            document.getElementById('partnersSection').innerHTML = '';
            addPartnerRow();
            const modal = new bootstrap.Modal(document.getElementById('addProjectModal'));
            modal.show();
        }
        
        function addPartnerRow() {
            const section = document.getElementById('partnersSection');
            const row = document.createElement('div');
            row.className = 'row mb-2';
            row.innerHTML = `
                <div class="col-md-5">
                    <select class="form-select partner-select">
                        <option value="">اختر الشريك</option>
                        ${partnersData.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}
                    </select>
                </div>
                <div class="col-md-3">
                    <input type="number" class="form-control partner-share" placeholder="النسبة %">
                </div>
                <div class="col-md-3">
                    <input type="number" class="form-control partner-amount" placeholder="المبلغ">
                </div>
                <div class="col-md-1">
                    <button class="btn btn-danger btn-sm" onclick="this.parentElement.parentElement.remove()">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            `;
            section.appendChild(row);
        }
        
        async function saveProject() {
            const partners = [];
            document.querySelectorAll('#partnersSection .row').forEach(row => {
                const partnerId = row.querySelector('.partner-select').value;
                const share = row.querySelector('.partner-share').value;
                const amount = row.querySelector('.partner-amount').value;
                
                if (partnerId) {
                    partners.push({
                        partner_id: partnerId,
                        share_percentage: parseFloat(share) || 0,
                        invested_amount: parseFloat(amount) || 0
                    });
                }
            });
            
            const data = {
                name: document.getElementById('projectName').value,
                description: document.getElementById('projectDescription').value,
                total_budget: parseFloat(document.getElementById('projectBudget').value),
                start_date: document.getElementById('projectStartDate').value,
                status: 'planning',
                partners: partners
            };
            
            try {
                const response = await fetch('/api/projects', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('addProjectModal')).hide();
                    loadProjects();
                    showAlert('تم إنشاء المشروع بنجاح', 'success');
                }
            } catch (error) {
                showAlert('خطأ في حفظ المشروع', 'danger');
            }
        }
        
        function showQuickEntryModal() {
            document.getElementById('quickVoucherForm').reset();
            loadProjectsForQuickEntry();
            const modal = new bootstrap.Modal(document.getElementById('quickEntryModal'));
            modal.show();
        }
        
        function loadProjectsForQuickEntry() {
            const select = document.getElementById('quickProject');
            select.innerHTML = '<option value="">اختر المشروع</option>' +
                projectsData.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
        }
        
        async function loadProjectPhases() {
            const projectId = document.getElementById('quickProject').value;
            if (!projectId) return;
            
            try {
                const response = await fetch(`/api/projects/${projectId}/phases`);
                const phases = await response.json();
                
                const select = document.getElementById('quickPhase');
                select.innerHTML = '<option value="">اختر المرحلة</option>' +
                    phases.map(ph => `<option value="${ph.id}">${ph.name}</option>`).join('');
            } catch (error) {
                console.error('Error loading phases:', error);
            }
        }
        
        async function loadPhaseSuppliers() {
            const phaseId = document.getElementById('quickPhase').value;
            if (!phaseId) return;
            
            try {
                const response = await fetch(`/api/phases/${phaseId}`);
                const phase = await response.json();
                
                const select = document.getElementById('quickSupplier');
                select.innerHTML = '<option value="">اختر المورد</option>' +
                    phase.suppliers.map(s => `
                        <option value="${s.id}">
                            ${s.name} (متبقي: ${formatMoney(s.remaining)})
                        </option>
                    `).join('');
            } catch (error) {
                console.error('Error loading suppliers:', error);
            }
        }
        
        async function saveQuickVoucher() {
            const projectId = document.getElementById('quickProject').value;
            const phaseId = document.getElementById('quickPhase').value;
            
            // Get project safe
            const project = await fetch(`/api/projects/${projectId}`).then(r => r.json());
            
            const data = {
                voucher_type: document.getElementById('quickVoucherType').value,
                amount: parseFloat(document.getElementById('quickAmount').value),
                description: document.getElementById('quickDescription').value,
                project_id: projectId,
                phase_id: phaseId,
                date: new Date().toISOString().split('T')[0]
            };
            
            if (data.voucher_type === 'payment') {
                data.supplier_id = document.getElementById('quickSupplier').value;
                data.safe_from_id = project.safe.id;
            } else {
                data.safe_to_id = project.safe.id;
            }
            
            try {
                const response = await fetch('/api/quick-voucher', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    const result = await response.json();
                    bootstrap.Modal.getInstance(document.getElementById('quickEntryModal')).hide();
                    showAlert(`تم إنشاء السند ${result.voucher_number} بنجاح`, 'success');
                    loadProjects();
                }
            } catch (error) {
                showAlert('خطأ في حفظ السند', 'danger');
            }
        }
        
        async function viewProject(id) {
            window.location.href = `/project/${id}`;
        }
        
        function formatMoney(amount) {
            return new Intl.NumberFormat('ar-EG', {
                style: 'currency',
                currency: 'EGP'
            }).format(amount || 0);
        }
        
        function showAlert(message, type) {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type} alert-dismissible fade show position-fixed top-0 start-50 translate-middle-x mt-3`;
            alert.style.zIndex = '9999';
            alert.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            document.body.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }
    </script>
</body>
</html>
