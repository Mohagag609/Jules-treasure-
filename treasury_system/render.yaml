services:
  - type: web
    name: treasury-system
    runtime: python
    buildCommand: "cd treasury_system && pip install -r requirements.txt"
    startCommand: "cd treasury_system && gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
    autoDeploy: true

databases:
  - name: treasury-db
    databaseName: treasury
    user: treasury_user
    plan: free