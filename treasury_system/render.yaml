services:
  - type: web
    name: treasury-system
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: treasury-db
          property: connectionString

databases:
  - name: treasury-db
    databaseName: treasury
    user: treasury_user
    plan: free