services:
  # Web Service - التطبيق الرئيسي
  - type: web
    name: construction-management
    runtime: node
    region: oregon # يمكنك تغييرها حسب موقعك
    plan: free # أو starter للأداء الأفضل
    buildCommand: ./scripts/render-build.sh
    startCommand: ./scripts/render-start.sh
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NEXTAUTH_URL
        sync: false # سيتم تعيينها بعد النشر مع URL الفعلي
      - key: NEXTAUTH_SECRET
        generateValue: true # Render سيولد قيمة عشوائية آمنة
      - key: DATABASE_URL
        fromDatabase:
          name: construction-db
          property: connectionString

databases:
  # PostgreSQL Database
  - name: construction-db
    plan: free # أو starter للأداء الأفضل
    databaseName: construction_projects
    user: construction_admin
    region: oregon # نفس المنطقة مع التطبيق
    postgresMajorVersion: 14
    ipAllowList: [] # السماح بالاتصالات من خدمة Render فقط